# Fly config for the Phase-1 app (PRD #96, ADR-064): ONE always-on machine, a
# 10 GB volume at /data, SQLite-on-volume, Cloudflare in front. No [processes]
# block — that would spawn separate machines and break the single SQLite writer.
#
# Operator sets `app` + region at create time; secrets (AUTH_JWT_SECRET, the R2
# keys, the R2 bucket/endpoint) come from `fly secrets set`, never this file.

app = "pilot-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Auth (ADR-063): fail-closed, credentials file + DB on the volume.
  AUTH_DEV_MODE = "0"
  APP_USERS_FILE = "/data/users.txt"
  # MUST point at the volume — the default repo path is ephemeral in-container
  # and unwatched by Litestream (PRD #96 pinned gotcha #1).
  DATABASE_URL = "sqlite+pysqlite:////data/lead_state.sqlite3"
  # The owners index ships in the served composite on the volume.
  OWNERS_INDEX_PATH = "/data/processed/composite/owners_index.json"
  # Litestream: the DB to replicate + the generic (non-secret) replica config.
  # LITESTREAM_BUCKET / LITESTREAM_ENDPOINT / the R2 keys come from Fly secrets.
  LITESTREAM_DB_PATH = "/data/lead_state.sqlite3"
  LITESTREAM_PATH = "lead_state"
  LITESTREAM_REGION = "auto"
  # Caddy wiring (same names the integration test sets). Volume at /data, so
  # DATA_WEB_ROOT="/" maps /data/processed/X -> /data/processed/X on disk.
  SITE_ROOT = "/srv/dist"
  DATA_WEB_ROOT = "/"
  BACKEND_UPSTREAM = "127.0.0.1:8000"
  CADDY_PORT = "8080"

# The volume holds the served composite (/data/processed), the SQLite DB and
# users.txt (volume root, never web-served). Create with:
#   fly volume create pilot_data --size 10 --region iad
[[mounts]]
  source = "pilot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: never stop the machine (no cold-start stutter), never run two
  # (SQLite is single-writer).
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Health check the whole pipe: Fly -> Caddy(:8080) -> uvicorn /api/health.
  # A hung process fails the check and the machine restarts.
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
