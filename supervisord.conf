; Process tree for the single Fly machine (PRD #96, ADR-064): uvicorn (the
; FastAPI backend), Caddy (SPA + /data Range + /api proxy), and Litestream
; (continuous SQLite -> R2). One machine, one writer — no [processes] fan-out.
;
; Every program logs to the container's stdout/stderr (fd 1/2) so `fly logs`
; shows uvicorn / Caddy / Litestream output. All inherit supervisord's
; environment, which on Fly is fly.toml [env] + Fly secrets.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:uvicorn]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/srv/backend
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:litestream]
command=litestream replicate -config /etc/litestream.yml
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=30
