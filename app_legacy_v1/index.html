<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Graham County Cell Tower Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <aside id="sidebar" class="open">
    <header class="sidebar-header">
      <h1>Graham County, NC</h1>
      <p class="subtitle">Cell-Tower &amp; Parcel Map</p>
      <button id="toggle-sidebar" type="button" title="Collapse sidebar">&laquo;</button>
    </header>

    <section class="panel summary">
      <div class="summary-row">
        <div>
          <span class="num" id="count-towers">—</span>
          <span class="lbl">ASR</span>
        </div>
        <div>
          <span class="num" id="count-uls">—</span>
          <span class="lbl">ULS</span>
        </div>
        <div>
          <span class="num" id="count-parcels">—</span>
          <span class="lbl">parcels</span>
        </div>
        <div>
          <span class="num" id="count-oz">—</span>
          <span class="lbl">prospects</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Layers</h2>
      <label class="toggle">
        <input type="checkbox" id="layer-oz" checked />
        <span class="swatch swatch-oz"></span>
        <span>Opportunity Zones</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="layer-parcels" checked />
        <span class="swatch swatch-parcel"></span>
        <span>Parcels</span>
      </label>
      <div class="legend-row">
        <span class="swatch swatch-host"></span>
        <span class="legend-lbl">hosts a tower</span>
        <span class="swatch swatch-host-oz"></span>
        <span class="legend-lbl">tower + OZ</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="layer-towers" checked />
        <span class="swatch swatch-tower"></span>
        <span>ASR Towers (≥200 ft)</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="layer-uls" checked />
        <span class="swatch swatch-uls"></span>
        <span>ULS Cellular (FCC raw)</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="layer-hifld" />
        <span class="swatch swatch-hifld"></span>
        <span>HIFLD Cellular (DHS)</span>
      </label>
    </section>

    <section class="panel">
      <h2>Filters</h2>
      <label class="toggle">
        <input type="checkbox" id="filter-only-host" />
        <span>Only parcels with towers</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="filter-only-oz" />
        <span>Only parcels in Opportunity Zones</span>
      </label>
      <label class="select-row">
        <span>Tower owner (ASR registrant)</span>
        <select id="filter-owner">
          <option value="">All owners</option>
        </select>
      </label>
      <label class="select-row">
        <span>Carrier (ULS licensee)</span>
        <select id="filter-carrier">
          <option value="">All carriers</option>
        </select>
      </label>
      <button id="reset-filters" type="button" class="link-btn">Reset</button>
    </section>

    <section class="panel details" id="details-panel">
      <h2>Details</h2>
      <div id="details-body" class="details-body">
        <p class="muted">Click a tower or parcel to see attributes.</p>
      </div>
    </section>

    <footer class="sidebar-footer">
      <span class="muted">Prototype · data: FCC ASR, NC OneMap, HUD OZ</span>
    </footer>
  </aside>

  <button id="open-sidebar" type="button" title="Open sidebar">&raquo;</button>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
