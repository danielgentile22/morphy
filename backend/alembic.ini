# Alembic config (PRD #134). The database URL is deliberately absent — env.py
# reads the app's DATABASE_URL via config.settings, so the CLI, the tests, and
# the boot-time upgrade all target the same database the app would use.
#
# Day-to-day (from the repo root, after editing models.py):
#   uv run alembic -c backend/alembic.ini revision --autogenerate -m "..." --rev-id 000N
#   uv run alembic -c backend/alembic.ini upgrade head
#   uv run alembic -c backend/alembic.ini upgrade head --sql   # preview the DDL
#
# Autogenerate output is a draft, never trusted blind — it cannot see data
# backfills, and SQLite ALTERs must survive batch-mode table rebuilds.

[alembic]
script_location = %(here)s/migrations
# Repo root, so env.py can import backend.app.* when run via the CLI — the
# declarative equivalent of the sys.path hacks PRD #132 banned from code.
prepend_sys_path = %(here)s/..

# Plain CLI logging; env.py loads this with disable_existing_loggers=False so
# a boot-time upgrade never silences the app's own loggers.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
