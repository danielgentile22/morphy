<!-- @dsCard group="Controls" name="Filter chips" subtitle="default / selected / with count" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filter chips</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../base.css" />
  <style>
    .count { color: var(--muted); font-size: 10.5px; }
    .chip.on .count { color: rgba(255, 255, 255, 0.75); }
  </style>
</head>
<body>
  <div class="ds-stage">
    <div class="ds-row">
      <button class="chip">AT&amp;T <span class="count">412</span></button>
      <button class="chip on">Verizon <span class="count">388</span></button>
      <button class="chip">T-Mobile <span class="count">301</span></button>
      <button class="chip">Crown Castle <span class="count">204</span></button>
      <button class="chip">SBA <span class="count">96</span></button>
      <button class="chip">Unknown <span class="count">1,140</span></button>
    </div>
  </div>
</body>
</html>
