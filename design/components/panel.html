<!-- @dsCard group="Surfaces" name="Sidebar panel & section header" subtitle="caps title + grouped rows" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../base.css" />
  <style>
    .panel { width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
    .panel + .panel { margin-top: 14px; }
    .group { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); }
    .group:last-child { border-bottom: none; }
    .group b { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <div class="ds-stage">
    <div class="panel">
      <h2>Layers</h2>
      <div class="group"><span>Towers</span><b>1,204</b></div>
      <div class="group"><span>Parcels</span><b>on</b></div>
      <div class="group"><span>Distress overlay</span><b>off</b></div>
    </div>
    <div class="panel">
      <h2>Selected tower</h2>
      <div class="group"><span>Owner</span><b>R. Calloway</b></div>
      <div class="group"><span>Carrier</span><b>Verizon</b></div>
      <div class="group"><span>Status</span><span class="pill" data-status="contacted">Contacted</span></div>
    </div>
  </div>
</body>
</html>
