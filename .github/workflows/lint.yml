name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run only the most-recent commit on a branch; cancel older runs in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # uv pins the interpreter from .python-version (3.11) and installs the
      # exact versions in uv.lock; the action caches ~/.cache/uv keyed on the
      # lockfile (PRD #132). Exact tag: setup-uv publishes no floating major.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dev tools (locked)
        run: uv sync --locked --only-group dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .
