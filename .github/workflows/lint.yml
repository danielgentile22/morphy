name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run only the most-recent commit on a branch; cancel older runs in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
