name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run only the most-recent commit on a branch; cancel older runs in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # uv pins the interpreter from .python-version (3.11) and installs the
      # exact versions in uv.lock; the action caches ~/.cache/uv keyed on the
      # lockfile (PRD #132). Exact tag: setup-uv publishes no floating major.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dev tools (locked)
        run: uv sync --locked --only-group dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .

  # Static type-check the backend only (PRD #136). A sibling of the ruff
  # check — same workflow, runs in parallel. Scope, exclusions, and rationale
  # live in [tool.pyright] in pyproject.toml. Kept a separate job because it
  # needs more installed than ruff: pyright resolves imports against the venv,
  # so the backend's real deps must be present.
  pyright:
    name: pyright (backend type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # dev = pyright itself (version-pinned in uv.lock — the PyPI wrapper
      # version pins the bundled checker, so local == CI); backend = the deps
      # pyright must resolve (fastapi/sqlalchemy/pydantic/alembic/PyJWT). The
      # pipeline/puller groups are deliberately omitted — the backend imports
      # neither, and they only slow the install.
      - name: Install type-check deps (locked)
        run: uv sync --locked --only-group dev --only-group backend

      # No path arg: pyright reads include = ["backend"] from pyproject.toml,
      # so this checks exactly the configured scope — identical to the local
      # one-liner `uv run pyright`.
      - name: Type-check backend
        run: uv run --no-sync pyright
