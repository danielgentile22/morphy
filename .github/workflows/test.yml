name: test

# Populated in Section 6 of the production-readiness plan; this scaffold
# exists from Section 2 so that `main` already has the workflow file
# when tests land. Until Section 6 ships, the job is a no-op that always
# passes so PRs aren't blocked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (placeholder until Section 6)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check if tests directory exists
        id: check_tests
        run: |
          if [ -d tests ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no tests yet)
        if: steps.check_tests.outputs.has_tests == 'false'
        run: echo "No tests/ directory yet — Section 6 of the production-readiness plan will populate this."

      - uses: actions/setup-python@v5
        if: steps.check_tests.outputs.has_tests == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        if: steps.check_tests.outputs.has_tests == 'true'
        run: pytest --cov=scripts.preprocess --cov-report=term-missing
