name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (full suite)
    runs-on: ubuntu-latest
    # 10 min (not 5): a cold uv cache downloads the GIS stack before the
    # ~1 min suite; warm-cache runs finish well under 5.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # uv pins the interpreter from .python-version (3.11) and installs the
      # exact versions in uv.lock; the action caches ~/.cache/uv keyed on the
      # lockfile (PRD #132). Exact tag: setup-uv publishes no floating major.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # All dependency groups + the project itself (editable) — the editable
      # install is what makes fetch/preprocess importable with zero sys.path
      # manipulation; tests/test_no_sys_path_hacks.py guards the latter.
      - name: Sync environment (locked)
        run: uv sync --locked

      - name: Run pytest
        run: uv run --no-sync pytest --cov --cov-report=term-missing
