name: frontend

# Gates the Svelte apps per PR (PRD #131): type-check, unit tests, and the
# production build, each as its own step so failures attribute clearly.
# The build step is deliberate — it is the only step that exercises the
# bundler config (manual chunks, worker imports) that previously failed
# only at deploy time.
#
# The matrix covers both Svelte apps in the repo: the map app (`app/`) and
# the Data Catalog (`audit-site/`, PRD #178). Both share the same scripts
# (check / test:unit / vite build), so one job definition gates each; a
# failure names the dir so it attributes cleanly.
#
# Playwright e2e is deliberately NOT part of this gate: the specs need
# real anchor-state composites (multi-GB, git-ignored) that CI does not
# have, so a per-PR e2e job would be permanently red or skipped. E2e
# stays a local/nightly concern — do not "fix" CI by adding it here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run only the most-recent commit on a branch; cancel older runs in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: svelte-check + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Both apps run independently — one red dir shouldn't mask the other.
      fail-fast: false
      matrix:
        dir: [app, audit-site]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 22 matches the Dockerfile frontend build stage (node:22-slim).
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test:unit

      # `npm run build` would re-run svelte-check before bundling; invoke
      # vite directly so the type-check step above stays the only one.
      - name: Production build (vite)
        run: npx vite build
