# Single Python toolchain: uv (PRD #132). `uv sync` creates .venv from
# uv.lock with every dependency group and installs the project editable,
# which is what makes `fetch` / `preprocess` (and the scripts/ top-level
# modules) importable with zero sys.path manipulation. The old
# requirements*.txt files are retired; dependencies live only here.

[project]
name = "pilot"
version = "0.1.0"
description = "Ground-lease intelligence: FCC ASR + state parcels + distress overlays, joined into a lead-triage product"
requires-python = ">=3.11"
# All runtime dependencies live in dependency groups below so each surface
# (pipeline, puller, backend image) installs only its own weight.
dependencies = []

[dependency-groups]
# Preprocess / GIS pipeline. pyarrow powers GeoParquet (v3 dual-write);
# openpyxl powers pandas.read_excel (ARC distressed, EIA 860/860M, FDOT
# billboards); jsonschema validates typed artifacts at pipeline runtime
# (scripts/preprocess/typed_artifact.py), not just in tests. duckdb is the
# heavy-lift compose engine (PRD #135); duckdb-extension-spatial ships the
# spatial extension as a locked wheel so sessions never download at runtime.
pipeline = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pandas>=2.0",
    "pyproj>=3.6",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "jsonschema>=4.21",
    "duckdb>=1.5.3",
    "duckdb-extension-spatial>=1.5.3",
]
# Desktop puller. PySide6 6.7.x is the LTS branch that works reliably on
# macOS arm64; 6.11.x had a cocoa-plugin load issue on this machine.
# boto3 is only exercised when the paid Regrid source is licensed;
# anthropic only when the user clicks "Diagnose this failure" (needs
# ANTHROPIC_API_KEY).
puller = [
    "PySide6==6.7.3",
    "boto3>=1.34",
    "anthropic>=0.40",
]
# Lead-triage write-layer (ADR-055). DB-agnostic via SQLAlchemy: SQLite by
# default, Postgres via DATABASE_URL=postgresql+psycopg://... PyJWT is the
# small vetted lib for the HS256 session tokens (password hashing is stdlib
# PBKDF2 — no extra dep). Alembic lives here (not dev) because the app runs
# upgrade-to-head at boot (PRD #134). This group is exactly what the Docker
# image installs (uv export --only-group backend), so keep it slim.
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "PyJWT>=2.8",
    "psycopg[binary]>=3.1",
]
# Dev-only. testcontainers backs the Postgres isolation test and was
# previously bundled into backend/requirements.txt (and thus the prod
# image); it is test tooling, so it lives here now. pmtiles verifies
# parcels.pmtiles output in tests/test_tiles.py. pyright type-checks the
# backend in CI (PRD #136); the PyPI wrapper version pins the bundled
# checker, so uv.lock pins it and local == CI.
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pmtiles>=3.7",
    "testcontainers[postgres]>=4.0",
    "pyright>=1.1.390",
]

[tool.uv]
# `uv sync` with no flags = the full dev environment (user story: one
# documented command produces a working environment).
default-groups = ["pipeline", "puller", "backend", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The import contract (PRD #132): scripts/ is the source root. fetch and
# preprocess are real packages; serve/verify_raw/diagnose are the top-level
# modules app_puller and the tests import. The editable install puts
# scripts/ on the path via .pth — same import names as before, no code
# needed to bootstrap them.
[tool.hatch.build.targets.wheel]
only-include = [
    "scripts/fetch",
    "scripts/preprocess",
    "scripts/serve.py",
    "scripts/verify_raw.py",
    "scripts/diagnose.py",
]
sources = ["scripts"]

[tool.pyright]
# Type-check the BACKEND ONLY (PRD #136). The backend guards the only
# irreplaceable data in the system (lead state, contact history, tenant
# isolation), is already type-annotated, and is small enough to check at zero
# diagnostics — so it gets the compile-time defense the frontend already has.
#
# scripts/, the preprocess pipeline, and app_puller/ are DELIBERATELY excluded:
# pandas/geopandas/shapely-heavy code drowns a type checker in noise that makes
# the gate ignorable, and the pipeline's test suite carries that weight instead.
# That boundary is the decision — do NOT "helpfully" widen `include` to scripts/
# or app_puller/. A per-module strict ratchet inside backend/ is allowed later.
#
# Pinned via the dev group in uv.lock so local == CI; venv below points pyright
# at the same locked deps. Run locally with: uv run pyright
# (no path arg — it reads `include` below, checking exactly what CI checks).
include = ["backend"]
# `backend` on the path so `app.*` resolves the way the deployed container
# imports it (uvicorn runs `app.main:app` from /srv/backend) — without this,
# pyright resolves bare `app` to the repo-root Svelte `app/` namespace dir.
# Tests' `backend.app.*` imports resolve via the repo root as usual.
extraPaths = ["backend"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "data",
]

[tool.ruff.lint]
# Conservative ruleset for now — bias toward catching real bugs rather than
# style nitpicks. Section 6 of the production-readiness plan may tighten this.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports, undefined names)
    "W",      # pycodestyle warnings
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear (likely-buggy patterns)
    "UP",     # pyupgrade (deprecated-syntax)
]
ignore = [
    "E501",   # line length — we set 100 above; let ruff format handle wrapping
    "E731",   # lambda assignments (acceptable in tiny helpers)
    "B008",   # function default values (acceptable for dataclass-style helpers)
    "UP042",  # str + Enum subclassing — Python 3.11 StrEnum is subtly different; defer migration
    "B904",   # raise-from chains — fix opportunistically as we touch each source in Section 4
    "B905",   # zip(..., strict=) — fix opportunistically; not a bug, just hardening
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use unused imports (for fixtures), assert, etc.
"tests/**" = ["F401", "F811", "B011"]
"backend/tests/**" = ["F401", "F811", "B011"]
# Schema files have intentional bare `pass` patterns
"scripts/preprocess/base.py" = ["B027"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",                # short summary of (a)ll non-passing results
    "--strict-markers",   # error on undeclared markers
    "--strict-config",    # error on undeclared config keys
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: requires real data on disk (deselect with -m 'not integration')",
    "tenant_isolation: multi-tenancy isolation tests (run with -k tenant_isolation)",
]

[tool.coverage.run]
source = ["scripts/preprocess", "scripts/fetch"]
omit = [
    "scripts/preprocess/normalizers/__init__.py",
    "scripts/preprocess/joins/__init__.py",
    "scripts/preprocess/views/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
